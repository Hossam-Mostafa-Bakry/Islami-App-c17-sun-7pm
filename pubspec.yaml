name: islami_app_c17_sun_7pm
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_svg:
  flutter_bounceable: ^1.2.0
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:

  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/core/gen/ # Optional (default: lib/gen/)
  # line_length: 80 # Optional

  # Optional
  integrations:
    image: true
    flutter_svg: true


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/files/quran/
    - assets/files/hadith/

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/janna_lt_regular.ttf


